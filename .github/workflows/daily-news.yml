name: Daily US News Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-news-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN is missing"
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_CHAT_ID is missing"
            exit 1
          fi
          echo "Secrets are present"

      - name: Run news agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: Asia/Kolkata
          LOOKBACK_HOURS: "2"
          MAX_ITEMS: "15"
          ENABLE_ARTICLE_SNIPPETS: "true"
          ARTICLE_SNIPPET_LIMIT: "8"
          SEND_EMPTY_DIGEST: "false"
          REQUEST_TIMEOUT: "15"
          EXCLUDE_URL_KEYWORDS: "sports,outkick,/video/"
          EXCLUDE_TITLE_KEYWORDS: "newsletter"
          SOURCES_FILE: "sources.json"
          STATE_FILE: "state.json"
        run: python new_agents.py --run-once
